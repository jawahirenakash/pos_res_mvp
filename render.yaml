# Render Blueprint — deploys the whole POS (web service + managed PostgreSQL).
# Create a new Blueprint Instance in the Render dashboard and pick this repo;
# Render provisions the database and web service from this file.
#
# `preDeployCommand` is a paid-plan feature, so migrations + the first-run seed
# run in startCommand instead. With SEED_SKIP_IF_DATA=1 the seed is skipped
# once data exists, so restarts and free-tier spin-ups never reset anything.
#
# After the first deploy:
#   - Demo owner password: Dashboard → posres-mvp → Environment →
#     SEED_OWNER_PASSWORD (Render generates it once).
#   - Sign in at your service URL as owner@tabletap.local and change the
#     password — the app forces it on first sign-in.
#   - To re-seed the demo data later, set SEED_SKIP_IF_DATA to 0 (or run
#     `npm run db:seed` from the service Shell) and restart the service.
#
# Redis (shared rate-limit/cache across instances) is optional and paid:
# add a Render Redis instance and set REDIS_URL to its internal connection
# string. Without it the app uses the in-process fallback (fine for one
# instance, which is what this blueprint runs).

databases:
  - name: posres-mvp-db
    databaseName: tabletap
    user: tabletap
    plan: free
    region: oregon

services:
  - type: web
    name: posres-mvp
    runtime: node
    plan: free
    region: oregon
    healthCheckPath: /api/health
    # --include=dev keeps the `prisma` CLI available at runtime even though
    # NODE_ENV=production is set for the service.
    buildCommand: npm ci --include=dev && npx prisma generate
    # Migrations must succeed before the app boots; the seed only writes when
    # the database is empty (see SEED_SKIP_IF_DATA below).
    startCommand: npx prisma migrate deploy && npm run db:seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: PORT
        value: "10000"
      - key: SEED_SKIP_IF_DATA
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: posres-mvp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_OWNER_EMAIL
        value: owner@tabletap.local
      - key: SEED_OWNER_PASSWORD
        generateValue: true